name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0.0)'
        required: true
        default: '1.0.0.0'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Prepare Lidarr binaries
      run: python scripts/prepare-lidarr.py

    - name: Build plugin
      run: dotnet build src/MusicEnhancer/MusicEnhancer.csproj -c Release

    - name: Run metadata tests
      run: dotnet run --project tests/MusicEnhancer.Tests/MusicEnhancer.Tests.csproj -c Release

    - name: Upload plugin package
      uses: actions/upload-artifact@v4
      with:
        name: plugin-package
        path: |
          src/MusicEnhancer/bin/Release/net8.0/Lidarr.Plugin.MusicEnhancer.dll
          src/MusicEnhancer/bin/Release/net8.0/Lidarr.Plugin.MusicEnhancer.net8.0.zip
        retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Download plugin package
      uses: actions/download-artifact@v4
      with:
        name: plugin-package
        path: release/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/Lidarr.Plugin.MusicEnhancer.dll
          release/Lidarr.Plugin.MusicEnhancer.net8.0.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
