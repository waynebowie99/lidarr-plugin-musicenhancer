name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0.0)'
        required: true
        default: '1.0.0.0'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build plugin
      run: |
        dotnet build src/MusicEnhancer/MusicEnhancer.csproj -c Release
      working-directory: MusicEnhancer

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: plugin-dll
        path: MusicEnhancer/src/MusicEnhancer/bin/Release/net8.0/Lidarr.Plugin.MusicEnhancer.dll
        retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    
    steps:
    - name: Download DLL
      uses: actions/download-artifact@v4
      with:
        name: plugin-dll
        path: release/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/Lidarr.Plugin.MusicEnhancer.dll
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-lidarr:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Lidarr
      run: |
        echo "Plugin deployed successfully!"
        echo "Version: ${{ github.ref_name }}"
        echo "Repository: ${{ github.repository }}"
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
